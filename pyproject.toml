[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-longseq"
version = "0.1.0"
description = "Evidence-grounded hierarchical browser agent and reproducible evaluation harness"
requires-python = ">=3.11"
dependencies = ["playwright>=1.57,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
benchmark = [
    "browsergym-core>=0.13.3",
    "browsergym-webarena>=0.13.3",
]
saas = ["pyyaml>=6,<7"]
chrome = [
    "browser-harness==0.1.13",
]

[project.scripts]
jev-browser = "jev_browser.cli:main"
jev-trace = "jev_browser.inspector:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_browser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
